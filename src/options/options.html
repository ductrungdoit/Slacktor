<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Slacktor Settings</title>
    <script type="module" src="./options.ts"></script>
  </head>
  <body>
    <main>
      <h1>Slacktor</h1>
      <p>Configure an OpenAI-compatible AI endpoint. Slack message text is sent only when you press Translate.</p>
      <form id="settings-form">
        <label>Base URL<input id="base-url" type="url" placeholder="https://api.example.com/v1" required /></label>
        <label>API key<input id="api-key" type="password" required /></label>
        <label>Model<input id="model" type="text" placeholder="gpt-4o-mini" required /></label>
        <label>Target language<input id="target-language" type="text" value="Vietnamese" required /></label>
        <button type="submit">Save settings</button>
        <p id="status" role="status"></p>
      </form>
    </main>
  </body>
</html>
